.<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego Alves — Terminal Interativo</title>
<style>
  :root { --bg:#0D1117; --term:#161B22; --cyan:#00F0FF; --purple:#B392F0; --green:#3FB950; --pink:#FF7B72; --txt:#E6EDF3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'JetBrains Mono', Consolas, monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 12px; }
  h1 { color:var(--cyan); font-size:1.1rem; margin-bottom:14px; text-align:center; }
  .window { width:100%; max-width:780px; background:var(--term); border:1px solid #30363D; border-radius:10px; overflow:hidden; box-shadow:0 0 40px rgba(0,240,255,.08); }
  .bar { background:#21262D; padding:10px 14px; display:flex; gap:8px; align-items:center; }
  .dot { width:12px; height:12px; border-radius:50%; }
  .bar span { margin-left:10px; color:#8B949E; font-size:.8rem; }
  #screen { height:60vh; min-height:320px; overflow-y:auto; padding:16px; font-size:.92rem; line-height:1.55; }
  #screen a { color:var(--cyan); text-decoration:none; border-bottom:1px dotted var(--cyan); }
  .in { color:var(--purple); }
  .ok { color:var(--green); }
  .err { color:var(--pink); }
  .cy { color:var(--cyan); }
  .input-row { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #30363D; background:#0D1117; }
  .input-row label { color:var(--green); white-space:nowrap; }
  #cmd { flex:1; background:transparent; border:none; outline:none; color:var(--txt); font:inherit; caret-color:var(--cyan); }
  .chips { width:100%; max-width:780px; display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center; }
  .chips button { background:transparent; border:1px solid var(--purple); color:var(--purple); border-radius:20px; padding:6px 14px; font:inherit; font-size:.8rem; cursor:pointer; transition:.15s; }
  .chips button:hover { background:var(--purple); color:var(--bg); }
  footer { margin-top:18px; color:#8B949E; font-size:.75rem; text-align:center; }
  footer a { color:var(--cyan); text-decoration:none; }
</style>
</head>
<body>

<h1>&gt; diego_alves.exe — terminal interativo</h1>

<div class="window">
  <div class="bar">
    <div class="dot" style="background:#FF5F57"></div>
    <div class="dot" style="background:#FEBC2E"></div>
    <div class="dot" style="background:#28C840"></div>
    <span>visitante@diego:~</span>
  </div>
  <div id="screen"></div>
  <div class="input-row">
    <label for="cmd">visitante@diego:~$</label>
    <input id="cmd" autocomplete="off" spellcheck="false" autofocus placeholder="digite 'help' e aperte Enter">
  </div>
</div>

<div class="chips">
  <button>help</button><button>sobre</button><button>stack</button><button>projetos</button>
  <button>jogar</button><button>curso</button><button>guanabara</button><button>frase</button><button>clear</button>
</div>

<footer>feito com 💜 por <a href="https://github.com/DiegoAlvesDs">Diego Alves</a> · <a href="https://github.com/DiegoAlvesDs">voltar ao perfil</a></footer>

<script>
const screen = document.getElementById('screen');
const input  = document.getElementById('cmd');

function print(html, cls = '') {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.innerHTML = html;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

const COMANDOS = {
  help: () => {
    print('Comandos disponiveis:');
    print('&nbsp;&nbsp;<span class="cy">sobre</span>     — quem e o Diego<br>&nbsp;&nbsp;<span class="cy">stack</span>     — tecnologias que estudo<br>&nbsp;&nbsp;<span class="cy">projetos</span>  — meus repositorios<br>&nbsp;&nbsp;<span class="cy">jogar</span>     — abre o Python Snake<br>&nbsp;&nbsp;<span class="cy">curso</span>     — meu curso de Python<br>&nbsp;&nbsp;<span class="cy">guanabara</span> — meus 105 exercicios<br>&nbsp;&nbsp;<span class="cy">frase</span>     — minha filosofia<br>&nbsp;&nbsp;<span class="cy">github</span>    — meu perfil<br>&nbsp;&nbsp;<span class="cy">clear</span>     — limpa o terminal');
  },
  sobre: () => {
    print('Ola! Eu sou o <span class="cy">Diego Alves</span> 🐍');
    print('Dev em aprendizado do Brasil. Comecei com Python, passei por logica de programacao e hoje crio jogos e projetos para a Web com <span class="in">JavaScript, HTML e CSS</span>.');
    print('Atualmente: criando meu <span class="ok">proprio curso de Python</span> e evoluindo meu jogo Python Snake.');
  },
  stack: () => {
    print('🐍 Python &nbsp;|&nbsp; ⚡ JavaScript &nbsp;|&nbsp; 🌐 HTML &nbsp;|&nbsp; 🎨 CSS &nbsp;|&nbsp; 🛠 VS Code + Git');
  },
  projetos: () => {
    print('🎮 <a href="https://github.com/DiegoAlvesDs/Python_Snake" target="_blank">Python Snake</a> — jogo da cobrinha com skins, temas e ranking global');
    print('📚 <a href="https://diegocapacapa.github.io/cursos/" target="_blank">Curso de Python</a> — meu curso feito do zero em HTML');
    print('🎓 <a href="https://github.com/DiegoAlvesDs/Guanabara" target="_blank">Guanabara</a> — 105 exercicios do Curso em Video resolvidos');
    print('🧠 <a href="https://github.com/DiegoAlvesDs/Aulas-Logicas" target="_blank">Aulas-Logicas</a> — 50 exercicios de logica organizados em modulos');
  },
  jogar: () => {
    print('<span class="ok">Abrindo o Python Snake...</span> 🐍');
    setTimeout(() => window.open('https://diegoalvesds.github.io/Python_Snake/', '_blank'), 800);
  },
  curso: () => {
    print('<span class="ok">Abrindo meu curso de Python...</span> 📚');
    setTimeout(() => window.open('https://diegocapacapa.github.io/cursos/', '_blank'), 800);
  },
  guanabara: () => {
    print('Resolvi os <span class="cy">105 exercicios</span> do curso do Guanabara (Mundos 1, 2 e 3):');
    print('<a href="https://github.com/DiegoAlvesDs/Guanabara" target="_blank">github.com/DiegoAlvesDs/Guanabara</a>');
  },
  frase: () => {
    print('<span class="in">"Nao preciso saber tudo. So preciso continuar aprendendo."</span>');
  },
  github: () => {
    print('<a href="https://github.com/DiegoAlvesDs" target="_blank">github.com/DiegoAlvesDs</a>');
  },
  clear: () => { screen.innerHTML = ''; },
  cobrinha: () => {
    print('<pre class="cy">_/\\_/\\_\n( o o ) aquele que programa a cobra...\n ==_==</pre>');
  },
  sudo: () => { print('<span class="err">Acesso negado 😄 o Diego e o unico admin aqui.</span>'); },
  diego: () => { print('Voce encontrou um easter egg! 🥚 tente: <span class="cy">cobrinha</span> ou <span class="cy">sudo</span>'); }
};

function executar(bruto) {
  const cmd = bruto.trim().toLowerCase();
  print(`<span class="in">visitante@diego:~$</span> ${bruto.replace(/</g, '&lt;')}`);
  if (!cmd) return;
  if (COMANDOS[cmd]) { COMANDOS[cmd](); return; }
  print(`<span class="err">comando nao encontrado:</span> ${cmd.replace(/</g, '&lt;')} — tente <span class="cy">help</span>`);
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { executar(input.value); input.value = ''; }
});

document.querySelectorAll('.chips button').forEach(b => {
  b.addEventListener('click', () => { executar(b.textContent); input.focus(); });
});

// boot
print('Bem-vindo ao meu terminal! 👋');
print('Aqui voce pode me conhecer digitando comandos. Comece com <span class="cy">help</span>.');
print('&nbsp;');
</script>
</body>
</html>
